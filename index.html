<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#edede7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cash Compass" />
    <script>
      let choice
      try {
        choice = localStorage.getItem('cash-compass-theme')
      } catch {
        choice = null
      }
      const dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      document.querySelector('meta[name="theme-color"]').content = dark ? '#121210' : '#edede7'
    </script>
    <meta name="description" content="Planifica tus gastos, ahorro e inversión con tus propios datos." />
    <link rel="icon" type="image/svg+xml" href="/compass.svg" />
    <title>Cash Compass</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
